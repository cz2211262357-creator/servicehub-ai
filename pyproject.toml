[project]
name = "servicehub-ai"
version = "0.1.0"
description = "Reliable AI customer support and after-sales platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncmy>=0.2.10,<0.3",
  "alembic>=1.14,<2",
  "redis>=6.2,<9",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<0.1",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5,<7",
  "prometheus-client>=0.21,<1",
  "email-validator>=2,<3",
  "cryptography>=45,<50",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/servicehub"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
addopts = "--basetemp=.cache/pytest-tmp -m \"not online\""
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "online: opt-in paid calls to configured external model APIs",
  "integration: requires real MySQL and Redis",
  "concurrency: validates races against real services",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
